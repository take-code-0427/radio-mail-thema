<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="今日のラジオ番組のメールテーマを一覧で探せるサイト" />
  <title>ラジオのお題</title>
  <style>
    :root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181a}button,input{font:inherit}.app{min-height:100vh;padding:14px 18px 24px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.brand{font-size:21px;font-weight:800;margin-right:6px}.date,.status{font-size:12px;color:#6b7077}.filter{border:1px solid #d4d7dc;background:#fff;color:#17181a;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:34px}.filter.active{background:#17181a;color:#fff;border-color:#17181a}.search{margin-left:auto;min-width:230px;border:1px solid #d4d7dc;background:#fff;color:#17181a;border-radius:7px;padding:7px 10px;font-size:13px}.table-wrap{overflow:auto;border:1px solid #d8dbe0;background:#fff;max-height:calc(100vh - 92px)}table{border-collapse:collapse;width:100%;min-width:980px;font-size:12px}thead th{position:sticky;top:0;background:#eceef1;z-index:2;text-align:left;padding:7px 9px;border-bottom:1px solid #cfd2d7;white-space:nowrap;font-size:11px;color:#555a61}tbody td{padding:7px 9px;border-bottom:1px solid #eceef1;vertical-align:middle}tbody tr:hover{background:#f7f8fa}.time{width:112px;font-variant-numeric:tabular-nums;white-space:nowrap}.station{width:125px;font-weight:750}.program{width:260px;font-weight:650}.theme{min-width:400px;font-size:13px}.actions{width:125px;white-space:nowrap}.live{color:#d63b3b;font-size:10px;font-weight:750}.soon{color:#80651d;font-size:10px}.mail{display:inline-block;text-decoration:none;color:#17181a;border:1px solid #cfd2d7;border-radius:6px;padding:4px 7px;background:#fff}.mail:hover{background:#eceef1}.no-theme{color:#969aa1}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:11px;color:#767b82}.empty{padding:28px;text-align:center;color:#767b82}
    @media(prefers-color-scheme:dark){body{background:#101113;color:#f3f4f6}.date,.status,.footer,.empty{color:#9ca3af}.filter,.search{background:#191b1f;color:#f3f4f6;border-color:#35383e}.filter.active{background:#f3f4f6;color:#17181a;border-color:#f3f4f6}.table-wrap{background:#17191c;border-color:#33363b}thead th{background:#202328;color:#b8bec7;border-color:#3a3e44}tbody td{border-color:#282b30}tbody tr:hover{background:#1d2024}.mail{background:#202328;color:#f3f4f6;border-color:#3c4046}.mail:hover{background:#2b2f35}.no-theme{color:#777d86}}
    @media(max-width:720px){.app{padding:10px}.brand{width:100%}.search{margin-left:0;min-width:100%}.table-wrap{max-height:none}}
  </style>
</head>
<body>
<main class="app">
  <div class="toolbar">
    <div class="brand">ラジオのお題</div>
    <div class="date" id="today"></div>
    <button class="filter active" data-station="all" type="button">すべて</button>
    <button class="filter" data-station="TBS" type="button">TBS</button>
    <button class="filter" data-station="QRR" type="button">文化放送</button>
    <button class="filter" data-station="LFR" type="button">ニッポン放送</button>
    <button class="filter" data-station="FMT" type="button">TOKYO FM</button>
    <button class="filter" data-station="FMJ" type="button">J-WAVE</button>
    <button class="filter" data-station="JORF" type="button">ラジオ日本</button>
    <input class="search" id="theme-search" type="search" placeholder="番組・テーマを検索" aria-label="番組・テーマを検索" />
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>時間</th><th>局</th><th>番組</th><th>今日のメールテーマ</th><th>投稿</th></tr></thead>
      <tbody id="theme-body"><tr><td colspan="5" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
  <div class="footer"><span id="count">読み込み中</span><span id="fetched"></span></div>
</main>
<script>
  const weekdays=['日','月','火','水','木','金','土'];
  const now=new Date();
  document.getElementById('today').textContent=`${now.getMonth()+1}/${now.getDate()} ${weekdays[now.getDay()]} 今日`;
  const tbody=document.getElementById('theme-body');
  const buttons=[...document.querySelectorAll('.filter')];
  const search=document.getElementById('theme-search');
  const count=document.getElementById('count');
  const fetched=document.getElementById('fetched');
  let station='all'; let programs=[];

  function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function jpTime(value){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value));}
  function state(p){const t=Date.now(),s=new Date(p.start_at).getTime(),e=new Date(p.end_at).getTime();if(s<=t&&t<e)return '<span class="live">● 放送中</span><br>';if(t<s&&s-t<60*60*1000)return '<span class="soon">このあと</span><br>';return '';}
  function action(p){const url=p.message_url||p.program_url;if(!url)return '<span class="no-theme">—</span>';const label=p.message_url?'投稿する':'番組ページ';return `<a class="mail" href="${esc(url)}" target="_blank" rel="noreferrer">${label}</a>`;}
  function render(){const q=search.value.trim().toLowerCase();const visible=programs.filter(p=>(station==='all'||p.station_id===station)&&(!q||`${p.station_name} ${p.program_name} ${p.theme||''}`.toLowerCase().includes(q)));if(!visible.length){tbody.innerHTML='<tr><td colspan="5" class="empty">条件に合う番組がありません</td></tr>';}else{tbody.innerHTML=visible.map(p=>`<tr><td class="time">${state(p)}${jpTime(p.start_at)}–${jpTime(p.end_at)}</td><td class="station">${esc(p.station_name)}</td><td class="program">${esc(p.program_name)}</td><td class="theme ${p.theme?'':'no-theme'}">${esc(p.theme||'テーマ情報なし')}</td><td class="actions">${action(p)}</td></tr>`).join('');}count.textContent=`${visible.length}番組を表示`;}
  buttons.forEach(btn=>btn.addEventListener('click',()=>{station=btn.dataset.station;buttons.forEach(b=>b.classList.toggle('active',b===btn));render();}));
  search.addEventListener('input',render);
  fetch('/api/themes').then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'load failed');programs=data.programs||[];if(programs.length){const latest=Math.max(...programs.map(p=>new Date(p.fetched_at).getTime()));fetched.textContent=`最終収集 ${new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date(latest))}`;}render();}).catch(err=>{console.error(err);tbody.innerHTML='<tr><td colspan="5" class="empty">データを読み込めませんでした。DB設定または収集ジョブを確認してください。</td></tr>';count.textContent='0番組';});
</script>
</body>
</html>
