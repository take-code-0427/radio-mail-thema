name: Collect radio themes

on:
  schedule:
    # 05:10 JST every day (GitHub Actions cron is UTC)
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYYMMDD). Empty = today in JST"
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and save
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/collect.py "$TARGET_DATE"
          else
            python scripts/collect.py
          fi
